<style>
/* Kun lån-specifik stil. Sidebar, topbar, kort, knapper, farver
   og mørkt tema ligger nu i app-core.css. */
.content { padding:24px 28px; max-width:1200px; }

/* Summary cards – .sum-card m.fl. ligger i app-core.css */
.summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }

/* Milestone banner */
.milestone-banner {
  display:flex; align-items:center; gap:12px;
  background:linear-gradient(135deg,#e6f7f1,#f0fdf8);
  border:1.5px solid rgba(26,158,110,0.35); border-radius:14px;
  padding:14px 18px; margin-bottom:24px; font-size:14px; color:var(--green-d);
}

/* Loan cards */
.loan-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-bottom:28px; }
.loan-card { background:var(--white); border:1px solid var(--border); border-radius:20px; padding:24px; position:relative; overflow:hidden; }
.loan-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; }
.loan-card.c-red::before    { background:var(--red); }
.loan-card.c-blue::before   { background:var(--blue); }
.loan-card.c-amber::before  { background:var(--amber); }
.loan-card.c-green::before  { background:var(--green); }
.loan-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:4px; }
.loan-name { font-family:'DM Serif Display',serif; font-size:19px; }
.loan-account { font-size:11px; color:var(--ink-3); margin-top:2px; letter-spacing:0.3px; }
.loan-badge { font-size:11px; font-weight:500; padding:4px 10px; border-radius:20px; flex-shrink:0; }
.loan-rest { font-size:28px; font-weight:300; font-family:'DM Serif Display',serif; margin:14px 0 2px; }
.loan-rest-label { font-size:11px; color:var(--ink-3); margin-bottom:14px; }
.loan-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; border-top:1px solid var(--border); padding-top:14px; margin-top:6px; }
.ls-label { font-size:11px; color:var(--ink-3); margin-bottom:3px; }
.ls-value { font-size:14px; font-weight:500; }
.loan-chart-wrap { height:110px; margin-top:14px; }
.loan-edit-btn { background:none; border:none; cursor:pointer; color:var(--ink-3); padding:4px; border-radius:6px; display:flex; }
.loan-edit-btn:hover { color:var(--green); background:var(--green-l); }

/* Combined chart – .chart-card/.chart-title ligger i app-core.css */
.big-chart-wrap { height:260px; }

/* Rentetal på lånekortet */
.loan-interest {
  display:flex; gap:14px; flex-wrap:wrap; margin-top:12px;
  padding:10px 12px; background:var(--surface); border-radius:10px;
  font-size:11.5px; color:var(--ink-2);
}
.loan-interest b { font-weight:600; font-variant-numeric:tabular-nums; }

/* Modal-stilene ligger nu i app-core.css */
@media (max-width:900px) { .loan-grid{grid-template-columns:1fr;} }
</style>

<script type="module">
/* Firebase initialiseres ét sted – se db.js.
   Det er dér, rettelsen af den langsomme mobilforbindelse ligger. */
import { db, requireAuth } from "./db.js?v=27";
import { collection, getDocs, doc, setDoc, addDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const esc    = window.AppCore.esc;
const toast  = window.AppCore.toast;
const fmtDKK = window.AppCore.fmtDKK;

let loans = [];
let isAdmin = false;
let editingId = null;
let charts = {};

const COLORS = { red:"#e84040", blue:"#2563eb", amber:"#d97706", green:"#1a9e6e" };
const MONTHS_SHORT = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];

requireAuth(u => {
  isAdmin = u.isAdmin;
  loadLoans();
});

async function loadLoans() {
  const doneSlow = window.AppCore.watchSlowLoad();
  try {
    const snap = await getDocs(collection(db, "loans"));
    doneSlow();
    loans = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!loans.length) await seedDefaults();
  } catch(e) {
    doneSlow();
    toast("Kunne ikke hente lån – tjek forbindelsen", "error");
    loans = [];
  }
  renderAll();
}

async function seedDefaults() {
  // Jeres 3 lån (kilde: netbank-billeder + budget)
  const defaults = [
    { name:"Boliglån", account:"9376 0020420502", rest:294617.76, ydelse:6970.86,
      end:"2030-04", color:"red", note:"Annuitetslån med fast løbetid · sidste bankdag i måneden" },
    { name:"Forbrugslån", account:"9376 0023634236", rest:67536.67, ydelse:1000,
      end:"2028-01", color:"blue", note:"Annuitetslån med fast løbetid · sidste bankdag i måneden" },
    { name:"Billån – Skoda", account:"", rest:2797, ydelse:2797,
      end:"2026-07", color:"amber", note:"Sidste ydelse juli 2026 🎉" },
  ];
  loans = [];
  for (const l of defaults) {
    try {
      const ref = await addDoc(collection(db, "loans"), l);
      loans.push({ id: ref.id, ...l });
    } catch(e) {
      loans.push({ id: "local_" + Math.random().toString(36).slice(2), ...l });
    }
  }
}

function monthsUntil(endYm) {
  if (!endYm) return null;
  const now = new Date();
  const [y, m] = endYm.split("-").map(Number);
  return Math.max(0, (y - now.getFullYear()) * 12 + (m - 1) - now.getMonth());
}

function fmtMonthYear(ym) {
  if (!ym) return "–";
  const [y, m] = ym.split("-");
  const M = ["Jan","Feb","Mar","Apr","Maj","Jun","Jul","Aug","Sep","Okt","Nov","Dec"];
  return `${M[parseInt(m)-1]} ${y}`;
}

function renderAll() {
  renderMilestones();
  renderSummary();
  renderCombinedChart();
  renderCards();
}

function renderMilestones() {
  const area = document.getElementById("milestone-area");
  const soon = loans.filter(l => {
    const mu = monthsUntil(l.end);
    return mu !== null && mu <= 2 && l.rest > 0;
  });
  if (!soon.length) { area.innerHTML = ""; return; }
  area.innerHTML = soon.map(l => {
    const mu = monthsUntil(l.end);
    const when = mu === 0 ? "denne måned" : mu === 1 ? "næste måned" : `om ${mu} måneder`;
    return `<div class="milestone-banner">
      <span style="font-size:22px;">🎉</span>
      <div>
        <strong>${esc(l.name)}</strong> er færdigbetalt ${when} (${fmtMonthYear(l.end)})
        – det frigør <strong>${fmtDKK(l.ydelse)}/mdr</strong> i budgettet fra ${fmtMonthYear(nextMonthAfter(l.end))}.
      </div>
    </div>`;
  }).join("");
}

function nextMonthAfter(ym) {
  if (!ym) return "";
  let [y, m] = ym.split("-").map(Number);
  m++; if (m > 12) { m = 1; y++; }
  return `${y}-${String(m).padStart(2,"0")}`;
}

function renderSummary() {
  const active = loans.filter(l => l.rest > 0);
  const totalDebt    = active.reduce((s,l) => s + (l.rest||0), 0);
  const totalMonthly = active.reduce((s,l) => s + (l.ydelse||0), 0);
  const ends = active.map(l => l.end).filter(Boolean).sort();
  const debtFree = ends.length ? ends[ends.length-1] : null;
  const nextEnd  = ends.length ? ends[0] : null;
  const nextLoan = active.find(l => l.end === nextEnd);

  document.getElementById("sum-debt").textContent     = fmtDKK(totalDebt);
  document.getElementById("sum-debt-sub").textContent = `${active.length} aktive lån`;
  document.getElementById("sum-monthly").textContent  = fmtDKK(totalMonthly);
  document.getElementById("sum-debtfree").textContent = fmtMonthYear(debtFree);
  const muFree = monthsUntil(debtFree);
  document.getElementById("sum-debtfree-sub").textContent = muFree !== null ? `om ${Math.floor(muFree/12)} år og ${muFree%12} mdr` : "";
  document.getElementById("sum-next").textContent     = fmtMonthYear(nextEnd);
  document.getElementById("sum-next-sub").textContent = nextLoan ? `${nextLoan.name} · frigør ${fmtDKK(nextLoan.ydelse)}/mdr` : "";
}

/* ── RIGTIG ANNUITETSBEREGNING ──
   Kurven var før lineær: restgælden faldt med samme beløb hver måned.
   Sådan opfører et annuitetslån sig ikke – i starten går det meste af
   ydelsen til renter, og gælden falder langsomt. Den lineære kurve gav
   derfor et for optimistisk billede det første år.

   Vi kender restgæld, ydelse og udløbsdato. Deraf kan renten udledes:
       restgæld = ydelse × (1 − (1+r)^−n) / r
   Der findes ingen lukket løsning for r, så den findes ved halvering
   (bisektion). Det er præcist nok til fire decimaler på under 1 ms. */
function solveMonthlyRate(rest, ydelse, n) {
  if (!(rest > 0) || !(ydelse > 0) || !(n > 0)) return 0;
  if (ydelse * n <= rest) return 0;   // ydelsen dækker end ikke hovedstolen

  const pv = r => r === 0 ? ydelse * n : ydelse * (1 - Math.pow(1 + r, -n)) / r;

  let lo = 0, hi = 1;                 // 0 % – 100 % pr. måned
  for (let i = 0; i < 100; i++) {
    const mid = (lo + hi) / 2;
    if (pv(mid) > rest) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

// Nøgletal pr. lån: udledt rente, samlet tilbagebetaling og renteudgift
function loanStats(l) {
  const n     = monthsUntil(l.end) || 0;
  const rate  = solveMonthlyRate(l.rest, l.ydelse, n);
  const total = (l.ydelse || 0) * n;
  return {
    months: n,
    monthlyRate: rate,
    yearlyPct: (Math.pow(1 + rate, 12) - 1) * 100,
    totalToPay: total,
    totalInterest: Math.max(0, total - (l.rest || 0)),
  };
}

// Restgældens forløb måned for måned – med renter
function buildSchedule(l, maxMonths) {
  const { monthlyRate } = loanStats(l);
  const points = [];
  let rest = l.rest || 0;
  for (let i = 0; i <= maxMonths; i++) {
    points.push(Math.max(0, Math.round(rest)));
    if (rest <= 0) continue;
    rest = rest + rest * monthlyRate - (l.ydelse || 0);
    if (rest < 0) rest = 0;
  }
  return points;
}

function renderCombinedChart() {
  if (charts.combined) charts.combined.destroy();
  const active = loans.filter(l => l.rest > 0);
  if (!active.length) return;

  const horizon = Math.max(...active.map(l => monthsUntil(l.end) || 0)) + 1;
  const now = new Date();
  const labels = [];
  for (let i = 0; i <= horizon; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    labels.push(`${MONTHS_SHORT[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`);
  }

  const datasets = active.map(l => ({
    label: l.name,
    data: buildSchedule(l, horizon),
    borderColor: COLORS[l.color] || "#1a9e6e",
    backgroundColor: (COLORS[l.color] || "#1a9e6e") + "22",
    borderWidth: 2, pointRadius: 0, fill: true, tension: 0.1,
  }));

  charts.combined = new Chart(document.getElementById("debtChart"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", align: "start",
          labels: { boxWidth: 18, boxHeight: 2, font: { size: 11 }, color: window.AppCore.cssVar("--chart-tick", "#64748b"), usePointStyle: true, pointStyle: "line" } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmtDKK(ctx.raw)}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 }, color: window.AppCore.cssVar("--chart-tick", "#64748b"), maxTicksLimit: 14 } },
        y: { grid: { color: window.AppCore.cssVar("--chart-grid", "rgba(0,0,0,0.05)") },
             ticks: { font: { size: 11 }, color: window.AppCore.cssVar("--chart-tick", "#64748b"), callback: v => v >= 1000 ? (v/1000).toFixed(0) + "t" : v } }
      }
    }
  });
}

function renderCards() {
  const grid = document.getElementById("loan-grid");
  Object.keys(charts).forEach(k => { if (k !== "combined" && charts[k]) charts[k].destroy(); });

  let html = loans.map(l => {
    const mu       = monthsUntil(l.end);
    const done     = l.rest <= 0;
    const soonDone = !done && mu !== null && mu <= 2;
    const badge = done
      ? `<span class="loan-badge" style="background:var(--green-l);color:var(--green-d)">✅ Færdigbetalt</span>`
      : soonDone
      ? `<span class="loan-badge" style="background:var(--amber-l);color:var(--amber)">🎉 Slut ${fmtMonthYear(l.end)}</span>`
      : `<span class="loan-badge" style="background:var(--surface);color:var(--ink-2)">${mu !== null ? mu + " mdr tilbage" : "Aktivt"}</span>`;

    const st = loanStats(l);
    const totalLeft = st.totalToPay;

    // Rentelinje – vises kun når tallene giver mening at udlede en rente af
    const interestRow = (!done && st.months > 0 && st.totalInterest > 0) ? `
      <div class="loan-interest">
        <span>Udledt rente <b>${st.yearlyPct.toFixed(2).replace(".", ",")} %</b> p.a.</span>
        <span>Renter tilbage <b>${fmtDKK(st.totalInterest)}</b></span>
        <span>Betalt i alt <b>${fmtDKK(st.totalToPay)}</b></span>
      </div>` : "";

    return `<div class="loan-card c-${l.color || 'red'}">
      <div class="loan-header">
        <div>
          <div class="loan-name">${esc(l.name)}</div>
          <div class="loan-account">${esc(l.account || "")}${l.note ? (l.account ? " · " : "") + esc(l.note) : ""}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          ${badge}
          ${isAdmin ? `<button class="loan-edit-btn" onclick="editLoan('${l.id}')" title="Rediger">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="loan-edit-btn" onclick="deleteLoan('${l.id}')" title="Slet">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          </button>` : ""}
        </div>
      </div>
      <div class="loan-rest" style="color:${COLORS[l.color] || 'var(--ink)'}">${fmtDKK(l.rest)}</div>
      <div class="loan-rest-label">restgæld</div>
      <div class="loan-stats">
        <div><div class="ls-label">Månedlig ydelse</div><div class="ls-value">${fmtDKK(l.ydelse)}</div></div>
        <div><div class="ls-label">Udløbsdato</div><div class="ls-value">${fmtMonthYear(l.end)}</div></div>
        <div><div class="ls-label">Tilbage at betale</div><div class="ls-value">${fmtDKK(totalLeft)}</div></div>
      </div>
      ${interestRow}
      <div class="loan-chart-wrap"><canvas id="lchart-${l.id}" role="img" aria-label="Restgæld for ${esc(l.name)}"></canvas></div>
    </div>`;
  }).join("");

  grid.innerHTML = html || '<div style="color:var(--ink-3);font-size:13px;padding:20px;">Ingen lån oprettet endnu</div>';

  setTimeout(() => loans.forEach(l => renderMiniChart(l)), 50);
}

function renderMiniChart(l) {
  const canvas = document.getElementById(`lchart-${l.id}`);
  if (!canvas || l.rest <= 0) return;
  const mu = monthsUntil(l.end) || 1;
  const horizon = Math.min(mu + 1, 60);
  const now = new Date();
  const labels = [];
  for (let i = 0; i <= horizon; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    labels.push(`${MONTHS_SHORT[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`);
  }
  charts[l.id] = new Chart(canvas, {
    type: "line",
    data: { labels, datasets: [{
      data: buildSchedule(l, horizon),
      borderColor: COLORS[l.color] || "#1a9e6e",
      backgroundColor: (COLORS[l.color] || "#1a9e6e") + "18",
      borderWidth: 2, pointRadius: 0, fill: true, tension: 0.1,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => " Restgæld: " + fmtDKK(ctx.raw) } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 9 }, color: window.AppCore.cssVar("--chart-tick", "#64748b"), maxTicksLimit: 6 } },
        y: { grid: { color: window.AppCore.cssVar("--chart-grid", "rgba(0,0,0,0.05)") },
             ticks: { font: { size: 9 }, color: window.AppCore.cssVar("--chart-tick", "#64748b"), callback: v => v >= 1000 ? (v/1000).toFixed(0) + "t" : v } }
      }
    }
  });
}

/* ── MODAL ── */
window.openModal = function() {
  editingId = null;
  document.getElementById("modal-title").textContent = "Nyt lån";
  ["f-name","f-account","f-rest","f-ydelse","f-end","f-note"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-color").value = "red";
  document.getElementById("modal").classList.add("open");
};
window.editLoan = function(id) {
  const l = loans.find(x => x.id === id);
  if (!l) return;
  editingId = id;
  document.getElementById("modal-title").textContent = "Rediger lån";
  document.getElementById("f-name").value    = l.name || "";
  document.getElementById("f-account").value = l.account || "";
  document.getElementById("f-rest").value    = l.rest ?? "";
  document.getElementById("f-ydelse").value  = l.ydelse ?? "";
  document.getElementById("f-end").value     = l.end || "";
  document.getElementById("f-note").value    = l.note || "";
  document.getElementById("f-color").value   = l.color || "red";
  document.getElementById("modal").classList.add("open");
};
window.closeModal = () => document.getElementById("modal").classList.remove("open");

window.saveLoan = async function() {
  const data = {
    name:    document.getElementById("f-name").value.trim(),
    account: document.getElementById("f-account").value.trim(),
    rest:    parseFloat(document.getElementById("f-rest").value)   || 0,
    ydelse:  parseFloat(document.getElementById("f-ydelse").value) || 0,
    end:     document.getElementById("f-end").value,
    note:    document.getElementById("f-note").value.trim(),
    color:   document.getElementById("f-color").value,
  };
  if (!data.name) { toast("Skriv venligst et navn", "error"); return; }
  try {
    if (editingId) {
      await setDoc(doc(db, "loans", editingId), data);
      loans = loans.map(l => l.id === editingId ? { id: editingId, ...data } : l);
    } else {
      const ref = await addDoc(collection(db, "loans"), data);
      loans.push({ id: ref.id, ...data });
    }
    toast("Lån gemt ✓", "success");
    window.AppCore.logAudit(db, { addDoc, collection }, editingId ? "Ændrede lån" : "Oprettede lån", `${data.name} · restgæld ${fmtDKK(data.rest)}`);
  } catch(e) {
    toast("Kunne ikke gemme i skyen – tjek forbindelsen", "error");
  }
  closeModal();
  renderAll();
};

window.deleteLoan = async function(id) {
  if (!confirm("Er du sikker på at du vil slette dette lån?")) return;
  try { await deleteDoc(doc(db, "loans", id)); }
  catch(e) { toast("Kunne ikke slette i skyen – tjek forbindelsen", "error"); }
  loans = loans.filter(l => l.id !== id);
  renderAll();
};

window.exportLoans = function() {
  const rows = loans.map(l => ({
    Navn: l.name || "", Konto: l.account || "", Restgaeld: l.rest || 0,
    Maanedlig_ydelse: l.ydelse || 0, Udloebsdato: l.end || "", Note: l.note || ""
  }));
  window.AppCore.exportCSV("laan", rows);
};

document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
